name: e2e

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # REST contract against a fake orchestrator, no KVM needed.
  fake:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: go vet ./...
      - run: go test -race ./...
      - run: npm install --no-audit --no-fund
        working-directory: test/sdk
      - run: python3 -m pip install --user --break-system-packages e2b
      - run: test/fake-e2e.sh

  # The real stack: Firecracker VMs on the runner's KVM.
  kvm:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM for the runner user
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Start e2b-minimal
        run: |
          umask 077
          {
            echo "E2B_API_KEY=e2b_$(openssl rand -hex 20)"
            echo "MEMORY_MODE=regular"
            echo "SANDBOX_ALL_MEMORY_MAX=6144"
            echo "DEFAULT_MEMORY_MB=2048"
            echo "PF_MIN_FREE_GIB=10"
          } > .env
          docker compose up -d --build
      - name: Wait for the base template
        run: |
          set -a; . ./.env; set +a
          for i in $(seq 180); do
            if curl -fsS -H "X-API-Key: $E2B_API_KEY" http://127.0.0.1:3000/templates | grep -q '"buildStatus":"ready"'; then
              echo "base template ready after $((i * 5))s"; exit 0
            fi
            if curl -fsS -H "X-API-Key: $E2B_API_KEY" http://127.0.0.1:3000/templates | grep -q '"buildStatus":"error"'; then
              echo "base template build failed"; exit 1
            fi
            sleep 5
          done
          exit 1
      - name: SDK tests with commands and files
        run: |
          set -a; . ./.env; set +a
          export E2B_API_URL=http://127.0.0.1:3000 E2B_SANDBOX_URL=http://127.0.0.1:3000
          (cd test/sdk && npm install --no-audit --no-fund && node lifecycle.mjs --exec)
          (cd test/sdk && node compat.mjs sandbox commands files pty git templates)
          python3 -m pip install --user --break-system-packages e2b
          python3 test/sdk/lifecycle.py --exec
      - name: Logs
        if: always()
        run: |
          docker compose logs --no-log-prefix | tail -400
          grep -E 'HugePages_(Total|Free)' /proc/meminfo
          df -h /
      - name: Stop
        if: always()
        run: docker compose down
